
services:
  backend:
      build: ./backend
      ports:
        - "3000:3000"
      env_file:
        - ./backend/.env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: dev_password_123
        DB_NAME: incidentvault
      depends_on:
        db:
          condition: service_healthy

          
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: incidentvault

    ports: 
    - "127.0.0.1:5433:5432"

    volumes:
    - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidentvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: