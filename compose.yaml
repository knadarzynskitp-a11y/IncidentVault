
services:
  backend:
      build: ./backend
      ports:
        - "3000:3000"
      env_file:
        - ./backend/.env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: dev_password_123
        DB_NAME: incidentvault
        REDIS_URL: redis://redis:6379
      depends_on:
        db:
          condition: service_healthy

          
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: incidentvault

    ports: 
    - "127.0.0.1:5433:5432"

    volumes:
    - postgres_data:/var/lib/postgresql
    - ./database/baza.sql:/docker-entrypoint-initdb.d/baza.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidentvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data: